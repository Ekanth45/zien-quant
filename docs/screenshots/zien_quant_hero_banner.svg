<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="440" fill="url(#bgGrad)"/>
  <rect width="1200" height="440" fill="url(#grid)"/>

  <!-- Top Accent Glow Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#cyanGlow)"/>

  <!-- Header Badge -->
  <rect x="50" y="38" width="170" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="64" cy="51" r="4" fill="#00f0ff"/>
  <text x="76" y="55" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5">NSE QUANT TERMINAL</text>

  <!-- Title & Subtitle -->
  <text x="50" y="105" fill="#f8fafc" font-size="38" font-weight="800" letter-spacing="-0.5">ZIEN QUANT <tspan fill="#00f0ff">v2.1</tspan></text>
  <text x="50" y="135" fill="#94a3b8" font-size="15" font-weight="400">Deterministic Mathematical Quant Engine &amp; Order Block Workstation</text>
  <text x="50" y="157" fill="#64748b" font-size="13" font-weight="400">100% Python Standard Library Backend • Zero Third-Party Pip Dependencies • Laya AI ModernBERT Integration</text>

  <!-- Feature Pills -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="105" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="10" y="16" fill="#38bdf8" font-size="11" font-weight="600">CPR Pivots</text>

    <rect x="115" y="0" width="130" height="24" rx="6" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="125" y="16" fill="#c084fc" font-size="11" font-weight="600">Camarilla H1-H5</text>

    <rect x="255" y="0" width="125" height="24" rx="6" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="265" y="16" fill="#34d399" font-size="11" font-weight="600">Supertrend(10,3)</text>

    <rect x="390" y="0" width="105" height="24" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.4"/>
    <text x="400" y="16" fill="#fbbf24" font-size="11" font-weight="600">VWAP ±1σ</text>

    <rect x="505" y="0" width="100" height="24" rx="6" fill="#1e293b" stroke="#f472b6" stroke-opacity="0.4"/>
    <text x="515" y="16" fill="#f472b6" font-size="11" font-weight="600">Wilder RSI</text>

    <rect x="615" y="0" width="105" height="24" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-opacity="0.4"/>
    <text x="625" y="16" fill="#60a5fa" font-size="11" font-weight="600">RVOL Spike</text>
  </g>

  <!-- Bottom Left: Tiers Breakdown Card -->
  <g transform="translate(50, 226)">
    <rect width="670" height="175" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    
    <text x="20" y="30" fill="#f1f5f9" font-size="14" font-weight="700">0–100 COMPOSITE QUANT RANKING TIERS</text>
    <text x="480" y="30" fill="#64748b" font-size="12">Strict PDF Thresholds</text>
    
    <!-- Tier Bars -->
    <!-- Bullish Tier -->
    <g transform="translate(20, 48)">
      <rect width="200" height="60" rx="8" fill="url(#bullGrad)" stroke="#10b981" stroke-width="1"/>
      <circle cx="20" cy="22" r="5" fill="#10b981"/>
      <text x="32" y="26" fill="#10b981" font-size="12" font-weight="700">BULLISH (BUY)</text>
      <text x="20" y="48" fill="#e2e8f0" font-size="18" font-weight="800">&gt; 70.0</text>
      <text x="80" y="48" fill="#94a3b8" font-size="11">/ 100 Score</text>
    </g>

    <!-- Normal Tier -->
    <g transform="translate(235, 48)">
      <rect width="200" height="60" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <circle cx="20" cy="22" r="5" fill="#94a3b8"/>
      <text x="32" y="26" fill="#cbd5e1" font-size="12" font-weight="700">NORMAL (NEUTRAL)</text>
      <text x="20" y="48" fill="#e2e8f0" font-size="18" font-weight="800">50.0 – 70.0</text>
      <text x="125" y="48" fill="#94a3b8" font-size="11">Range</text>
    </g>

    <!-- Bearish Tier -->
    <g transform="translate(450, 48)">
      <rect width="200" height="60" rx="8" fill="url(#bearGrad)" stroke="#ef4444" stroke-width="1"/>
      <circle cx="20" cy="22" r="5" fill="#ef4444"/>
      <text x="32" y="26" fill="#ef4444" font-size="12" font-weight="700">BEARISH (SELL)</text>
      <text x="20" y="48" fill="#e2e8f0" font-size="18" font-weight="800">&lt; 50.0</text>
      <text x="80" y="48" fill="#94a3b8" font-size="11">/ 100 Score</text>
    </g>

    <text x="20" y="132" fill="#94a3b8" font-size="11">Formula Breakdown: Trend/Supertrend (25 pts) + Pivots/Camarilla (25 pts) + RVOL (20 pts) + RSI (15 pts) + VWAP (15 pts)</text>
    <text x="20" y="152" fill="#38bdf8" font-size="11">Risk Gate: Mandatory Minimum Risk-to-Reward Ratio R:R ≥ 1.5 anchored to swing boundaries</text>
  </g>

  <!-- Right Side: Spotlight Cards -->
  <!-- Best Stock Card -->
  <g transform="translate(750, 50)">
    <rect width="400" height="165" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="400" height="30" rx="10" fill="#10b981" fill-opacity="0.15"/>
    
    <text x="18" y="20" fill="#10b981" font-size="11" font-weight="700" letter-spacing="1">BEST STOCK OF THE DAY</text>
    <rect x="290" y="7" width="95" height="18" rx="9" fill="#10b981"/>
    <text x="303" y="20" fill="#064e3b" font-size="10" font-weight="800">SCORE 86.4</text>

    <text x="18" y="58" fill="#f8fafc" font-size="22" font-weight="800">TCS.NS</text>
    <text x="18" y="76" fill="#94a3b8" font-size="12">Tata Consultancy Services • ₹3,842.50 (+2.15%)</text>

    <!-- Metrics Grid -->
    <text x="18" y="105" fill="#64748b" font-size="11">CPR State:</text>
    <text x="80" y="105" fill="#34d399" font-size="11" font-weight="600">Above TC (Bullish)</text>

    <text x="210" y="105" fill="#64748b" font-size="11">Supertrend:</text>
    <text x="280" y="105" fill="#34d399" font-size="11" font-weight="600">Bullish (+1)</text>

    <text x="18" y="125" fill="#64748b" font-size="11">Wilder RSI:</text>
    <text x="80" y="125" fill="#f8fafc" font-size="11" font-weight="600">64.8 (Momentum)</text>

    <text x="210" y="125" fill="#64748b" font-size="11">RVOL Surge:</text>
    <text x="280" y="125" fill="#fbbf24" font-size="11" font-weight="600">2.41x (Spike)</text>

    <rect x="18" y="138" width="364" height="18" rx="4" fill="#064e3b" fill-opacity="0.4"/>
    <text x="26" y="151" fill="#6ee7b7" font-size="10" font-weight="600">✓ Laya AI ModernBERT: Confirmed Strong Long Accumulation</text>
  </g>

  <!-- Worst Stock Card -->
  <g transform="translate(750, 236)">
    <rect width="400" height="165" rx="10" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="400" height="30" rx="10" fill="#ef4444" fill-opacity="0.15"/>
    
    <text x="18" y="20" fill="#ef4444" font-size="11" font-weight="700" letter-spacing="1">WORST STOCK OF THE DAY</text>
    <rect x="290" y="7" width="95" height="18" rx="9" fill="#ef4444"/>
    <text x="303" y="20" fill="#450a0a" font-size="10" font-weight="800">SCORE 32.1</text>

    <text x="18" y="58" fill="#f8fafc" font-size="22" font-weight="800">HDFCBANK.NS</text>
    <text x="18" y="76" fill="#94a3b8" font-size="12">HDFC Bank Limited • ₹1,498.20 (-1.84%)</text>

    <!-- Metrics Grid -->
    <text x="18" y="105" fill="#64748b" font-size="11">CPR State:</text>
    <text x="80" y="105" fill="#f87171" font-size="11" font-weight="600">Below BC (Bearish)</text>

    <text x="210" y="105" fill="#64748b" font-size="11">Supertrend:</text>
    <text x="280" y="105" fill="#f87171" font-size="11" font-weight="600">Bearish (-1)</text>

    <text x="18" y="125" fill="#64748b" font-size="11">Wilder RSI:</text>
    <text x="80" y="125" fill="#f8fafc" font-size="11" font-weight="600">38.2 (Depressed)</text>

    <text x="210" y="125" fill="#64748b" font-size="11">VWAP Band:</text>
    <text x="280" y="125" fill="#f87171" font-size="11" font-weight="600">Below -1σ</text>

    <rect x="18" y="138" width="364" height="18" rx="4" fill="#450a0a" fill-opacity="0.4"/>
    <text x="26" y="151" fill="#fca5a5" font-size="10" font-weight="600">✓ Laya AI ModernBERT: Confirmed Strong Short Distribution</text>
  </g>
</svg>